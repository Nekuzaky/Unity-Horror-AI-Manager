<!doctype html>
<!--
  Turns one of the brand pages into a PNG in the browser: the page runs in an iframe, its DOM and styles are drawn
  through an SVG foreignObject onto a canvas, then posted back to the local server started by Tools/Render-Brand.ps1.
  Usage: render.html?page=banner.html&w=1280&h=400&out=docs/images/banner.png
-->
<html><head><meta charset="utf-8"><title>Horror AI Manager brand renderer</title></head>
<body style="background:#222;color:#ddd;font:14px sans-serif">
<pre id="status">Rendering...</pre>
<script>
(async function () {
  const status = document.getElementById('status');
  const params = new URLSearchParams(location.search);
  const page = params.get('page'), out = params.get('out');
  const width = +params.get('w'), height = +params.get('h');

  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:absolute;left:-10000px;top:0;border:0;width:' + width + 'px;height:' + height + 'px';
  document.body.appendChild(frame);
  await new Promise(resolve => { frame.onload = resolve; frame.src = page; });
  await new Promise(resolve => setTimeout(resolve, 400));
  const doc = frame.contentDocument;

  let css = '';
  for (const link of doc.querySelectorAll('link[rel=stylesheet]'))
    css += await (await fetch(link.getAttribute('href'))).text() + '\n';
  for (const style of doc.querySelectorAll('style'))
    css += style.textContent + '\n';
  css = css.replace(/html,\s*body/g, '.fo-body').replace(/(^|[\s,}])body(?=[\s{.,])/g, '$1.fo-body');

  const wrapper = document.createElement('div');
  wrapper.className = 'fo-body';
  wrapper.innerHTML = doc.body.innerHTML;
  wrapper.querySelectorAll('script').forEach(s => s.remove());
  const content = new XMLSerializer().serializeToString(wrapper);
  const style = '<style>' + css.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
    '.fo-body{position:relative;width:' + width + 'px;height:' + height + 'px;overflow:hidden}</style>';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
    '<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">' + style + content +
    '</div></foreignObject></svg>';

  const image = new Image();
  image.width = width;
  image.height = height;
  await new Promise((resolve, reject) => {
    image.onload = resolve;
    image.onerror = reject;
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(image, 0, 0, width, height);
  const response = await fetch('/save?out=' + encodeURIComponent(out), { method: 'POST', body: canvas.toDataURL('image/png') });
  status.textContent = (response.ok ? 'saved ' : 'failed ') + out;
  document.title = response.ok ? 'done' : 'failed';
})().catch(error => {
  document.getElementById('status').textContent = 'error: ' + error;
  document.title = 'failed';
});
</script>
</body></html>
