name: Bug report
description: An enemy, a component or the Horror AI window does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! If you can, reproduce the problem with the **Greybox Demo** sample
        (Package Manager > Horror AI Manager > Samples) or a tiny scene. The **Tools > Horror AI > Open Horror AI** window shows the
        state of every enemy and the reason of its last transition: please copy it into the report.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect the enemy to do, and what did it do instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Sight (view cone, occlusion, suspicion)
        - Light (exposure, flashlight, crouching)
        - Hearing (noises, walls, Noise Emitter)
        - Memory (last known position)
        - Behavior (states, transitions, events)
        - Patrol routes and NavMesh
        - Inspectors, gizmos and the Horror AI window
        - Resonance or Hindsight integration
        - Performance or memory
        - Other
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity Editor version
      placeholder: 6000.3.13f1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Horror AI Manager version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: log
    attributes:
      label: Console output
      description: Errors from the Unity Console, with their stack traces.
      render: text
